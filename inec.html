<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f4f7f5;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .container {
            max-width: 650px;
            margin: 25px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #16813b;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d9dfdb;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            background: #fff;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #16813b;
            box-shadow: 0 0 0 2px rgba(22,129,59,0.08);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #16813b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover {
            background: #10652d;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #888;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px 16px;
                margin: 10px auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Registration Form</h2>

    <p class="description">
        Please complete all required fields.
    </p>

    <form id="registrationForm">

        <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>
        </div>

        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
                <option value="Prefer not to say">Prefer not to say</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nationality">Nationality</label>
            <input type="text" id="nationality" name="nationality"
                   placeholder="e.g. Nigerian" required>
        </div>

        <div class="form-group">
            <label for="state">State of Origin</label>
            <select id="state" name="state" required>
                <option value="">Select State</option>
                <option>Abia</option>
                <option>Adamawa</option>
                <option>Akwa Ibom</option>
                <option>Anambra</option>
                <option>Bauchi</option>
                <option>Bayelsa</option>
                <option>Benue</option>
                <option>Borno</option>
                <option>Cross River</option>
                <option>Delta</option>
                <option>Ebonyi</option>
                <option>Edo</option>
                <option>Ekiti</option>
                <option>Enugu</option>
                <option>Gombe</option>
                <option>Imo</option>
                <option>Jigawa</option>
                <option>Kaduna</option>
                <option>Kano</option>
                <option>Katsina</option>
                <option>Kebbi</option>
                <option>Kogi</option>
                <option>Kwara</option>
                <option>Lagos</option>
                <option>Nasarawa</option>
                <option>Niger</option>
                <option>Ogun</option>
                <option>Ondo</option>
                <option>Osun</option>
                <option>Oyo</option>
                <option>Plateau</option>
                <option>Rivers</option>
                <option>Sokoto</option>
                <option>Taraba</option>
                <option>Yobe</option>
                <option>Zamfara</option>
                <option>Federal Capital Territory (FCT)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="lga">Local Government Area (LGA)</label>
            <input type="text" id="lga" name="lga"
                   placeholder="Enter your LGA" required>
        </div>

        <div class="form-group">
            <label for="address">Residential Address</label>
            <textarea id="address" name="address"
                      placeholder="Enter your residential address"
                      required></textarea>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="e.g. 08012345678"
                   pattern="[0-9+\-\s()]{7,20}"
                   required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email address" required>
        </div>

        <div class="form-group">
            <label for="marital">Marital Status</label>
            <select id="marital" name="marital" required>
                <option value="">Select Marital Status</option>
                <option value="Single">Single</option>
                <option value="Married">Married</option>
                <option value="Divorced">Divorced</option>
                <option value="Widowed">Widowed</option>
                <option value="Separated">Separated</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">
            Submit Application
        </button>

    </form>

    <div class="footer">
        Please check that your information is correct before submitting.
    </div>

</div>

<script>
    // Replace this with your actual external application URL.
    const applicationURL = "https://inec-recruitment.github.io/Share-Job-/job#1792707125190";

    document.getElementById("registrationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            if (!this.checkValidity()) {
                this.reportValidity();
                return;
            }

            // Open the external application page.
            window.location.href = applicationURL;
        });
</script>

</body>
</html>
